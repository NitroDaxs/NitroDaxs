<svg xmlns="http://www.w3.org/2000/svg" width="840" height="230" viewBox="0 0 840 230" role="img" aria-label="Miroslav, building full-stack apps with React and ASP.NET Core">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#10261a"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3fb950" stop-opacity="0"/><stop offset=".35" stop-color="#3fb950"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="838" height="228" rx="14"/></clipPath>
  </defs>
  <style>
    .name { font: 700 44px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .tag { font: 18px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
    .prompt { font: 14px ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace; fill: #3fb950; }
    .pulse { fill: none; stroke: url(#line); stroke-width: 2.5; stroke-linejoin: round; stroke-dasharray: 1200; animation: draw 5s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 1200; } 55%, 100% { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="1" y="1" width="838" height="228" rx="14" fill="url(#fill)" stroke="#30363d"/>
  <text x="32" y="50" class="prompt">~/nitrodaxs $ whoami</text>
  <text x="32" y="100" class="name">Miroslav</text>
  <text x="32" y="132" class="tag">Building full-stack apps with React and ASP.NET Core, from Bulgaria</text>
  <g clip-path="url(#frame)"><path class="pulse" d="M0 190 H250 l14 -8 l12 8 h22 l10 12 l18 -44 l20 60 l14 -28 h26 l14 -8 l14 8 H840"/></g>
</svg>
