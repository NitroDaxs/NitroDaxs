<svg xmlns="http://www.w3.org/2000/svg" width="840" height="358" viewBox="0 0 840 358" role="img" aria-label="Languages used across public repositories: C# 18.6%, JavaScript 17.7%, PHP 16.6%, EJS 14.2%, TypeScript 14.1%, HTML 11.4%, Other 7.4%">
  <style>
    .title { font: 600 20px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .label { font: 500 14px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .pct { font: 500 13px ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace; fill: #8b949e; }
    .foot { font: 12px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
    .bar { transform-box: fill-box; transform-origin: left; animation: grow 900ms cubic-bezier(.2,.8,.2,1) both; }
    .row { animation: fade 500ms ease-out both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="1" y="1" width="838" height="356" rx="14" fill="#0d1117" stroke="#30363d"/>
  <text x="32" y="46" class="title">Languages I've used</text>
  <g class="row" style="animation-delay:0ms">
    <text x="32" y="91" class="label">C#</text>
    <rect x="150" y="80" width="580" height="12" rx="6" fill="#21262d"/>
    <rect class="bar" x="150" y="80" width="107.9" height="12" rx="6" fill="#2ea043" style="animation-delay:0ms"/>
    <text x="808" y="91" class="pct" text-anchor="end">18.6%</text>
  </g>
  <g class="row" style="animation-delay:90ms">
    <text x="32" y="125" class="label">JavaScript</text>
    <rect x="150" y="114" width="580" height="12" rx="6" fill="#21262d"/>
    <rect class="bar" x="150" y="114" width="102.4" height="12" rx="6" fill="#f1e05a" style="animation-delay:90ms"/>
    <text x="808" y="125" class="pct" text-anchor="end">17.7%</text>
  </g>
  <g class="row" style="animation-delay:180ms">
    <text x="32" y="159" class="label">PHP</text>
    <rect x="150" y="148" width="580" height="12" rx="6" fill="#21262d"/>
    <rect class="bar" x="150" y="148" width="96.4" height="12" rx="6" fill="#8892bf" style="animation-delay:180ms"/>
    <text x="808" y="159" class="pct" text-anchor="end">16.6%</text>
  </g>
  <g class="row" style="animation-delay:270ms">
    <text x="32" y="193" class="label">EJS</text>
    <rect x="150" y="182" width="580" height="12" rx="6" fill="#21262d"/>
    <rect class="bar" x="150" y="182" width="82.6" height="12" rx="6" fill="#a91e50" style="animation-delay:270ms"/>
    <text x="808" y="193" class="pct" text-anchor="end">14.2%</text>
  </g>
  <g class="row" style="animation-delay:360ms">
    <text x="32" y="227" class="label">TypeScript</text>
    <rect x="150" y="216" width="580" height="12" rx="6" fill="#21262d"/>
    <rect class="bar" x="150" y="216" width="81.5" height="12" rx="6" fill="#3178c6" style="animation-delay:360ms"/>
    <text x="808" y="227" class="pct" text-anchor="end">14.1%</text>
  </g>
  <g class="row" style="animation-delay:450ms">
    <text x="32" y="261" class="label">HTML</text>
    <rect x="150" y="250" width="580" height="12" rx="6" fill="#21262d"/>
    <rect class="bar" x="150" y="250" width="66.0" height="12" rx="6" fill="#e34c26" style="animation-delay:450ms"/>
    <text x="808" y="261" class="pct" text-anchor="end">11.4%</text>
  </g>
  <g class="row" style="animation-delay:540ms">
    <text x="32" y="295" class="label">Other</text>
    <rect x="150" y="284" width="580" height="12" rx="6" fill="#21262d"/>
    <rect class="bar" x="150" y="284" width="43.2" height="12" rx="6" fill="#8b949e" style="animation-delay:540ms"/>
    <text x="808" y="295" class="pct" text-anchor="end">7.4%</text>
  </g>
  <text x="32" y="340" class="foot">Share of code across public repositories, updated 2026-10-31</text>
